name: CineVerso Feature Validation
# Validates isolated UI fixes before merging.

on:
  push:
    branches: [ feature/franquias-notas-backup, fix/screen-flicker, fix/franchise-detection, feature/franchises-in-my-list, fix/franchise-navigation-and-suggestions, fix/global-back-navigation-scroll, fix/franchise-suggestions-speed-and-persistence, feature/franchise-status-and-navigation-cleanup, feature/infinite-franchise-discovery ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Android debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: cineverso-feature-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
